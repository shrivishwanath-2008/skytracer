<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skytrace</title>
  <link rel="stylesheet" href="/static-ui/style.css" />
</head>
<body>
  <header>
    <h1>Skytrace</h1>
    <p>Upload a night-sky photo, set when and where you shot it, and get a labeled image.</p>
  </header>

  <main>
    <form id="form">
      <section class="field">
        <label for="file">Photo</label>
        <input type="file" id="file" accept="image/*" required />
      </section>

      <section class="field">
        <label for="city">City</label>
        <input type="text" id="city" list="cities" placeholder="e.g. new york" required />
        <datalist id="cities"></datalist>
      </section>

      <section class="field">
        <label for="direction">Direction (where the camera points)</label>
        <select id="direction" required>
          <option value="0">North</option>
          <option value="45">Northeast</option>
          <option value="90" selected>East</option>
          <option value="135">Southeast</option>
          <option value="180">South</option>
          <option value="225">Southwest</option>
          <option value="270">West</option>
          <option value="315">Northwest</option>
        </select>
        <span class="hint">Compass bearing in degrees (image center).</span>
      </section>

      <section class="field">
        <label for="altitude">Height above horizon (degrees)</label>
        <input type="number" id="altitude" value="45" min="5" max="89" required />
      </section>

      <section class="field">
        <label for="timestamp">Date &amp; time (UTC)</label>
        <input type="datetime-local" id="timestamp" required />
      </section>

      <button type="submit" id="submit">Process image</button>
    </form>

    <p id="status" class="status" aria-live="polite"></p>

    <section id="result" class="result" hidden>
      <h2>Result</h2>
      <img id="output" alt="Annotated night sky" />
      <p id="summary" class="summary"></p>
    </section>
  </main>

  <script src="/static-ui/app.js"></script>
</body>
</html>
